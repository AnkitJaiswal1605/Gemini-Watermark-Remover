<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Watermark Remover</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f13;
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #4285f4, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: #888;
            font-size: 0.95rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Upload area */
        .upload-area {
            border: 2px dashed #333;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #16161d;
            margin-bottom: 24px;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: #4285f4;
            background: #1a1a2e;
        }

        .upload-area svg {
            width: 48px;
            height: 48px;
            stroke: #555;
            margin-bottom: 16px;
        }

        .upload-area p {
            color: #888;
            margin-bottom: 8px;
        }

        .upload-area .browse {
            color: #4285f4;
            text-decoration: underline;
            cursor: pointer;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #4285f4;
            color: #fff;
        }

        .btn-primary:hover { background: #3b78e7; }

        .btn-primary:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #2a2a3a;
            color: #ccc;
        }

        .btn-secondary:hover { background: #3a3a4a; }

        .btn-success {
            background: #34a853;
            color: #fff;
        }

        .btn-success:hover { background: #2d9249; }

        .btn-danger {
            background: #ea4335;
            color: #fff;
        }

        .btn-danger:hover { background: #d33426; }

        /* Image grid */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .image-card {
            background: #16161d;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222;
        }

        .image-card .preview {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-card .preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .image-card .preview .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .image-card:hover .preview .overlay { opacity: 1; }

        .image-card .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-badge.pending { background: #333; color: #888; }
        .status-badge.processing { background: #f9ab00; color: #000; }
        .status-badge.done { background: #34a853; color: #fff; }

        .image-card .info {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .image-card .info .name {
            font-size: 0.85rem;
            color: #aaa;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 160px;
        }

        .image-card .info .actions {
            display: flex;
            gap: 6px;
        }

        .image-card .info .actions button {
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        /* Progress */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 24px;
            display: none;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #4285f4, #a855f7);
            border-radius: 2px;
            transition: width 0.3s;
            width: 0%;
        }

        .hidden { display: none !important; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #2a2a3a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.9rem;
            transition: transform 0.3s;
            z-index: 100;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <header>
        <h1>Gemini Watermark Remover</h1>
        <p>Upload Gemini-generated images to remove the watermark. Batch processing supported.</p>
    </header>

    <div class="container">
        <!-- Upload -->
        <div class="upload-area" id="uploadArea">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
            </svg>
            <p>Drag & drop images here</p>
            <p>or <span class="browse">browse files</span></p>
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
        </div>

        <!-- Batch controls -->
        <div class="controls" id="batchControls">
            <button class="btn-primary" id="processAllBtn" disabled>Remove Watermarks</button>
            <button class="btn-success hidden" id="downloadAllBtn">Download All</button>
            <button class="btn-danger hidden" id="clearAllBtn">Clear All</button>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>

        <!-- Image grid -->
        <div class="image-grid" id="imageGrid"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const state = { images: [] };
        const $ = id => document.getElementById(id);

        // DOM refs
        const uploadArea = $('uploadArea');
        const fileInput = $('fileInput');
        const imageGrid = $('imageGrid');
        const processAllBtn = $('processAllBtn');
        const downloadAllBtn = $('downloadAllBtn');
        const clearAllBtn = $('clearAllBtn');
        const progressBar = $('progressBar');
        const progressFill = $('progressFill');

        // Upload handlers
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', e => handleFiles(e.target.files));

        function handleFiles(files) {
            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                const entry = {
                    id: crypto.randomUUID(),
                    file,
                    name: file.name,
                    originalUrl: URL.createObjectURL(file),
                    processedUrl: null,
                    processedBlob: null,
                    status: 'pending'
                };
                state.images.push(entry);
            }
            fileInput.value = '';
            render();
        }

        function render() {
            processAllBtn.disabled = state.images.length === 0;
            const hasDone = state.images.some(i => i.status === 'done');
            downloadAllBtn.classList.toggle('hidden', !hasDone);
            clearAllBtn.classList.toggle('hidden', state.images.length === 0);

            imageGrid.innerHTML = '';
            for (const img of state.images) {
                const card = document.createElement('div');
                card.className = 'image-card';
                const displayUrl = img.processedUrl || img.originalUrl;
                card.innerHTML = `
                    <div class="preview">
                        <img src="${displayUrl}" alt="${img.name}">
                        <span class="status-badge ${img.status}">${img.status === 'done' ? 'Done' : img.status === 'processing' ? 'Processing…' : 'Pending'}</span>
                    </div>
                    <div class="info">
                        <span class="name" title="${img.name}">${img.name}</span>
                        <div class="actions">
                            ${img.status === 'done' ? `<button class="btn-success" onclick="downloadOne('${img.id}')">↓</button>` : ''}
                            <button class="btn-secondary" onclick="removeOne('${img.id}')">✕</button>
                        </div>
                    </div>
                `;
                imageGrid.appendChild(card);
            }
        }

        // Remove single image
        window.removeOne = function(id) {
            const idx = state.images.findIndex(i => i.id === id);
            if (idx !== -1) {
                URL.revokeObjectURL(state.images[idx].originalUrl);
                if (state.images[idx].processedUrl) URL.revokeObjectURL(state.images[idx].processedUrl);
                state.images.splice(idx, 1);
                render();
            }
        };

        // Download single image
        window.downloadOne = function(id) {
            const img = state.images.find(i => i.id === id);
            if (!img || !img.processedBlob) return;
            downloadBlob(img.processedBlob, 'clean_' + img.name);
        };

        function downloadBlob(blob, name) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }

        // Download all
        downloadAllBtn.addEventListener('click', () => {
            const done = state.images.filter(i => i.status === 'done');
            for (const img of done) {
                downloadBlob(img.processedBlob, 'clean_' + img.name);
            }
            toast(`Downloading ${done.length} image(s)`);
        });

        // Clear all
        clearAllBtn.addEventListener('click', () => {
            for (const img of state.images) {
                URL.revokeObjectURL(img.originalUrl);
                if (img.processedUrl) URL.revokeObjectURL(img.processedUrl);
            }
            state.images = [];
            render();
        });

        // Process all
        processAllBtn.addEventListener('click', async () => {
            const pending = state.images.filter(i => i.status !== 'done');
            if (pending.length === 0) { toast('All images already processed'); return; }

            processAllBtn.disabled = true;
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';

            for (let i = 0; i < pending.length; i++) {
                pending[i].status = 'processing';
                render();
                await processImage(pending[i]);
                pending[i].status = 'done';
                progressFill.style.width = ((i + 1) / pending.length * 100) + '%';
                render();
            }

            processAllBtn.disabled = false;
            toast(`Processed ${pending.length} image(s)`);
            setTimeout(() => { progressBar.style.display = 'none'; }, 1500);
        });

        const ALPHA_NOISE_FLOOR = 3 / 255;  // Quantization noise threshold
        const ALPHA_THRESHOLD = 0.002;       // Skip negligible alpha pixels
        const LOGO_VALUE = 255;              // Watermark is pure white

        // Load an alpha map image and extract per-pixel alpha values
        function loadAlphaMap(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    c.width = img.width;
                    c.height = img.height;
                    const ctx = c.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const data = ctx.getImageData(0, 0, img.width, img.height).data;
                    const alphaMap = new Float32Array(img.width * img.height);
                    for (let i = 0; i < alphaMap.length; i++) {
                        const r = data[i * 4] / 255;
                        const g = data[i * 4 + 1] / 255;
                        const b = data[i * 4 + 2] / 255;
                        let a = Math.max(r, g, b);
                        // Apply noise floor
                        a = Math.max(0, a - ALPHA_NOISE_FLOOR);
                        alphaMap[i] = a;
                    }
                    resolve({ alphaMap, width: img.width, height: img.height });
                };
                img.src = src;
            });
        }

        // Pre-load both alpha maps at startup
        let alphaMap48 = null, alphaMap96 = null;
        (async () => {
            [alphaMap48, alphaMap96] = await Promise.all([
                loadAlphaMap(ALPHA_MAP_48_SRC),
                loadAlphaMap(ALPHA_MAP_96_SRC),
            ]);
        })();

        // Core watermark removal using exact reverse alpha blending
        async function processImage(entry) {
            // Wait for alpha maps to be ready
            while (!alphaMap48 || !alphaMap96) {
                await new Promise(r => setTimeout(r, 50));
            }

            const img = new Image();
            img.src = entry.originalUrl;
            await new Promise(r => img.onload = r);

            const w = img.naturalWidth;
            const h = img.naturalHeight;

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            // Gemini uses 96px logo + 64px margin when BOTH dimensions > 1024,
            // otherwise 48px logo + 32px margin
            const isLarge = w > 1024 && h > 1024;
            const logoSize = isLarge ? 96 : 48;
            const margin = isLarge ? 64 : 32;
            const { alphaMap } = isLarge ? alphaMap96 : alphaMap48;

            // Watermark top-left position
            const wmX = w - margin - logoSize;
            const wmY = h - margin - logoSize;

            // Extract the watermark region from the image
            const imageData = ctx.getImageData(wmX, wmY, logoSize, logoSize);
            const pixels = imageData.data;

            // Reverse alpha blending for each pixel:
            // watermarked = alpha * 255 + (1 - alpha) * original
            // original = (watermarked - alpha * 255) / (1 - alpha)
            for (let i = 0; i < alphaMap.length; i++) {
                const alpha = alphaMap[i];
                if (alpha < ALPHA_THRESHOLD) continue;

                const cappedAlpha = Math.min(alpha, 0.99);
                const invAlpha = 1 / (1 - cappedAlpha);
                const pi = i * 4;

                pixels[pi]     = clamp(Math.round((pixels[pi]     - cappedAlpha * LOGO_VALUE) * invAlpha));
                pixels[pi + 1] = clamp(Math.round((pixels[pi + 1] - cappedAlpha * LOGO_VALUE) * invAlpha));
                pixels[pi + 2] = clamp(Math.round((pixels[pi + 2] - cappedAlpha * LOGO_VALUE) * invAlpha));
            }

            ctx.putImageData(imageData, wmX, wmY);

            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            entry.processedBlob = blob;
            if (entry.processedUrl) URL.revokeObjectURL(entry.processedUrl);
            entry.processedUrl = URL.createObjectURL(blob);
        }

        function clamp(v) { return Math.max(0, Math.min(255, v)); }

        function toast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        render();
    </script>
